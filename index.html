<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGENZERSTÖRER 900000 💀🔥</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    cursor:none;
    font-family:Impact, Comic Sans MS, sans-serif;
}

html,body{
    overflow:hidden;
    width:100%;
    height:100%;
}

body{
    animation:
        bg 0.03s infinite,
        rotateScreen 0.5s infinite linear,
        invert 0.1s infinite;
    perspective:1000px;
}

@keyframes bg{
    0%{background:#ff0000;}
    10%{background:#00ff00;}
    20%{background:#0000ff;}
    30%{background:#ffff00;}
    40%{background:#ff00ff;}
    50%{background:#00ffff;}
    60%{background:white;}
    70%{background:black;}
    80%{background:orange;}
    90%{background:lime;}
    100%{background:hotpink;}
}

@keyframes rotateScreen{
    0%{transform:rotate(0deg) scale(1);}
    25%{transform:rotate(5deg) scale(1.2);}
    50%{transform:rotate(-5deg) scale(0.8);}
    75%{transform:rotate(10deg) scale(1.4);}
    100%{transform:rotate(-10deg) scale(1);}
}

@keyframes invert{
    0%{filter:invert(0);}
    50%{filter:invert(1);}
    100%{filter:invert(0);}
}

.warning{
    position:absolute;
    font-size:80px;
    font-weight:900;
    animation:
        spin 0.2s infinite linear,
        rainbow 0.05s infinite,
        shake 0.01s infinite;
    mix-blend-mode:difference;
    text-shadow:
        0 0 10px red,
        0 0 20px lime,
        0 0 30px cyan,
        0 0 40px magenta;
}

@keyframes spin{
    from{transform:rotate(0deg) scale(1);}
    to{transform:rotate(360deg) scale(3);}
}

@keyframes rainbow{
    0%{color:red;}
    20%{color:yellow;}
    40%{color:lime;}
    60%{color:cyan;}
    80%{color:magenta;}
    100%{color:white;}
}

@keyframes shake{
    0%{margin-left:0;margin-top:0;}
    25%{margin-left:50px;}
    50%{margin-left:-50px;}
    75%{margin-top:50px;}
    100%{margin-top:-50px;}
}

.marquee{
    position:absolute;
    white-space:nowrap;
    font-size:100px;
    font-weight:bold;
    animation:
        move 0.5s linear infinite,
        rainbow 0.05s infinite;
}

@keyframes move{
    from{transform:translateX(-200%);}
    to{transform:translateX(300%);}
}

.square{
    position:absolute;
    animation:
        cubeSpin 0.1s infinite linear,
        pulse 0.05s infinite alternate;
    mix-blend-mode:screen;
}

@keyframes cubeSpin{
    from{
        transform:
            rotateX(0deg)
            rotateY(0deg)
            rotateZ(0deg);
    }
    to{
        transform:
            rotateX(360deg)
            rotateY(360deg)
            rotateZ(360deg);
    }
}

@keyframes pulse{
    from{
        transform:scale(0.5);
        opacity:0.2;
    }
    to{
        transform:scale(3);
        opacity:1;
    }
}

.flash{
    position:absolute;
    width:100%;
    height:100%;
    background:white;
    pointer-events:none;
    animation:flash 0.05s infinite;
}

@keyframes flash{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}
</style>
</head>

<body>

<div class="flash"></div>

<div class="warning" style="top:20%;left:20%;">
💀🔥 AUGENZERSTÖRER 🔥💀
</div>

<div class="warning" style="top:50%;left:50%;">
⛵ NEUE SEGEL ⛵
</div>

<div class="warning" style="top:70%;left:10%;">
DER KOLLEGE DA HINTEN
</div>

<div class="marquee" style="top:5%;">
⚠️⚠️⚠️ WARNUNG ⚠️⚠️⚠️
</div>

<div class="marquee" style="top:85%;animation-duration:0.2s;">
🔥💀🔥💀🔥💀🔥💀🔥💀🔥💀
</div>

<script>
function randomColor(){
    return `hsl(${Math.random()*360},100%,50%)`;
}

for(let i=0;i<500;i++){
    const s=document.createElement("div");
    s.classList.add("square");

    const size=Math.random()*200+20;

    s.style.width=size+"px";
    s.style.height=size+"px";

    s.style.left=Math.random()*window.innerWidth+"px";
    s.style.top=Math.random()*window.innerHeight+"px";

    s.style.background=randomColor();

    s.style.animationDuration=
        (Math.random()*0.1+0.02)+"s";

    document.body.appendChild(s);
}

setInterval(()=>{
    const t=document.createElement("div");

    t.className="warning";

    t.innerHTML=
        ["💀🔥","⚠️","⛵","HAHA","AUGENKREBS","NEUE SEGEL"]
        [Math.floor(Math.random()*6)];

    t.style.left=Math.random()*100+"vw";
    t.style.top=Math.random()*100+"vh";

    t.style.fontSize=(Math.random()*150+20)+"px";

    document.body.appendChild(t);

    setTimeout(()=>t.remove(),1000);
},30);

setInterval(()=>{
    document.body.style.filter=
        `
        hue-rotate(${Math.random()*360}deg)
        blur(${Math.random()*5}px)
        contrast(${Math.random()*5+1})
        saturate(${Math.random()*10+1})
        `;
},20);

setInterval(()=>{
    window.scrollTo(
        Math.random()*1000,
        Math.random()*1000
    );
},10);
</script>

</body>
</html>
